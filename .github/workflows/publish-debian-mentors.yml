name: Publish Debian source to Mentors

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to package and upload (for example 1.0.9)"
        required: true
        default: "1.0.9"

permissions:
  contents: read

jobs:
  upload:
    name: Build, sign, and upload
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential dpkg-dev debhelper dh-python python3-all \
            python3-setuptools python3-wheel python3-pytest \
            desktop-file-utils appstream lintian dput gnupg

      - name: Build, sign, and upload source package
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          export GNUPGHOME="$(mktemp -d)"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          KEY_FILE="$(mktemp)"
          chmod 600 "$KEY_FILE"
          GPG_PRIVATE_KEY="$GPG_PRIVATE_KEY" python3 - "$KEY_FILE" <<'PY'
          import json
          import os
          import sys

          value = os.environ.get("GPG_PRIVATE_KEY", "")
          if value.startswith('"') and value.endswith('"'):
              try:
                  value = json.loads(value)
              except ValueError:
                  pass
          value = value.replace("\\r\\n", "\n").replace("\\n", "\n")
          if not value.endswith("\n"):
              value += "\n"
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              handle.write(value)
          PY
          gpg --batch --import "$KEY_FILE"
          rm -f "$KEY_FILE"
          KEY_ID="$(gpg --batch --list-secret-keys --with-colons 2>/dev/null | awk -F: '/^fpr:/ {print $10; exit}')"
          test -n "$KEY_ID"

          # dpkg-buildpackage invokes gpg without a passphrase flag. Wrap gpg
          # so the CI secret is supplied through the loopback pinentry.
          mkdir -p "$HOME/gpg-bin"
          cat > "$HOME/gpg-bin/gpg" <<'EOF'
          #!/bin/sh
          exec /usr/bin/gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" "$@"
          EOF
          chmod 700 "$HOME/gpg-bin/gpg"
          export PATH="$HOME/gpg-bin:$PATH"

          # 3.0 (quilt) source packages need an upstream tarball. Export
          # the release tag without Debian packaging or repository metadata.
          ORIG_DIR="$(mktemp -d)"
          mkdir -p "$ORIG_DIR/network-monitor-${VERSION}"
          git archive --format=tar HEAD | tar -x -C "$ORIG_DIR/network-monitor-${VERSION}"
          rm -rf "$ORIG_DIR/network-monitor-${VERSION}/debian" \
                 "$ORIG_DIR/network-monitor-${VERSION}/.github"
          tar -C "$ORIG_DIR" -czf "../network-monitor_${VERSION}.orig.tar.gz" \
            "network-monitor-${VERSION}"
          rm -rf "$ORIG_DIR"

          dpkg-buildpackage -S -sa -k"$KEY_ID"
          CHANGES="$(ls ../network-monitor_${VERSION}-1_source.changes)"
          DSC="$(ls ../network-monitor_${VERSION}-1.dsc)"
          gpg --verify "$CHANGES"
          gpg --verify "$DSC"
          lintian --fail-on error "$CHANGES"

          cat > "$HOME/.dput.cf" <<'EOF'
          [mentors]
          fqdn = mentors.debian.net
          incoming = /upload
          method = https
          allow_unsigned_uploads = 0
          progress_indicator = 2
          allowed_distributions = .*
          EOF

          dput mentors "$CHANGES"
