name: Release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (for example 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm binutils desktop-file-utils file python3-packaging
          rpm --version
          rpmbuild --version
          dpkg-deb --version | head -n 1

      - name: Cache Python runtime
        uses: actions/cache@v4
        with:
          path: build/runtime
          key: runtime-${{ runner.os }}-${{ hashFiles('packaging/build-runtime.sh') }}

      - name: Build Python runtime
        run: ./packaging/build-runtime.sh

      - name: Build Debian package
        run: ./packaging/build-deb.sh

      - name: Build RPM package
        run: ./packaging/build-rpm.sh

      - name: Build AppImage
        run: ./packaging/build-appimage.sh

      - name: Generate SHA256SUMS
        run: |
          cd build
          sha256sum \
            network-monitor_*.deb \
            network-monitor-*.rpm \
            NetworkMonitor-*.AppImage > SHA256SUMS
          cat SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: network-monitor-${{ env.VERSION }}
          path: |
            build/network-monitor_*.deb
            build/network-monitor-*.rpm
            build/NetworkMonitor-*.AppImage
            build/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Network Monitor ${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          overwrite_files: true
          files: |
            build/network-monitor_*.deb
            build/network-monitor-*.rpm
            build/NetworkMonitor-*.AppImage
            build/SHA256SUMS

      - name: Remove build tool from release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete-asset "${{ github.ref_name }}" appimagetool-x86_64.AppImage -y || true
