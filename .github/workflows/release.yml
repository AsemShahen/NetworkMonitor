name: Release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (for example 1.0.8)"
        required: true
        default: "1.0.8"

permissions:
  contents: write

concurrency:
  group: package-repository
  cancel-in-progress: false

jobs:
  build:
    # AppImageHub tests on the oldest supported Ubuntu LTS (22.04).  Building
    # the runtime and AppImage on 24.04 produces GLIBC_2.38 references, which
    # cannot start on 22.04.  Keep this on 22.04 so the portable AppImage stays
    # compatible with the catalog's baseline.
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TAG_NAME="v${VERSION}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            TAG_NAME="${GITHUB_REF_NAME}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm binutils desktop-file-utils file python3-packaging apt-utils gnupg zsync
          sudo apt-get install -y createrepo-c || sudo apt-get install -y createrepo
          # Qt's xcb platform plugin needs these on the build host so the
          # AppImage can bundle them for minimal systems.
          sudo apt-get install -y \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-util1 \
            libxcb-xinerama0 libxcb-xkb1
          rpm --version
          rpmbuild --version
          dpkg-deb --version | head -n 1
          command -v apt-ftparchive
          command -v createrepo_c || command -v createrepo

      - name: Cache Python runtime
        uses: actions/cache@v4
        with:
          path: build/runtime
          key: runtime-${{ runner.os }}-ubuntu2204-${{ hashFiles('packaging/build-runtime.sh') }}

      - name: Build Python runtime
        run: ./packaging/build-runtime.sh

      - name: Build Debian package
        run: ./packaging/build-deb.sh

      - name: Build RPM package
        run: ./packaging/build-rpm.sh

      - name: Build AppImage
        run: ./packaging/build-appimage.sh

      - name: Build manual update tarball
        run: ./packaging/build-manual.sh

      - name: Generate SHA256SUMS
        run: |
          cd build
          sha256sum \
            network-monitor_*.deb \
            network-monitor-*.rpm \
            NetworkMonitor-*.AppImage \
            NetworkMonitor-*.AppImage.zsync \
            NetworkMonitor-*-linux-x86_64.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Sign SHA256SUMS
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::warning::GPG_PRIVATE_KEY is not configured; SHA256SUMS.asc was not created."
            exit 0
          fi
          export GNUPGHOME="$(mktemp -d)"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          KEY_FILE="$(mktemp)"
          chmod 600 "$KEY_FILE"
          GPG_PRIVATE_KEY="$GPG_PRIVATE_KEY" python3 - "$KEY_FILE" <<'PY'
          import json
          import os
          import sys

          value = os.environ.get("GPG_PRIVATE_KEY", "")
          if value.startswith('"') and value.endswith('"'):
              try:
                  value = json.loads(value)
              except ValueError:
                  pass
          value = value.replace("\\r\\n", "\n").replace("\\n", "\n")
          if not value.endswith("\n"):
              value += "\n"
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              handle.write(value)
          PY
          gpg --batch --import "$KEY_FILE"
          rm -f "$KEY_FILE"
          GPG_KEY_ID="$(gpg --batch --list-secret-keys --with-colons 2>/dev/null | awk -F: '/^fpr:/ {print $10; exit}')"
          test -n "$GPG_KEY_ID"
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${GPG_PASSPHRASE:-}" \
            --local-user "$GPG_KEY_ID" \
            --armor --detach-sign --output build/SHA256SUMS.asc build/SHA256SUMS
          gpg --verify build/SHA256SUMS.asc build/SHA256SUMS
          ls -lh build/SHA256SUMS build/SHA256SUMS.asc

      - name: Verify AppImage update information
        run: |
          APPIMAGE="$(ls build/NetworkMonitor-*.AppImage)"
          INFO="$("$APPIMAGE" --appimage-updateinfo)"
          echo "$INFO"
          case "$INFO" in
            gh-releases-zsync\|AsemShahen\|NetworkMonitor\|latest\|*) ;;
            *) echo "Invalid or missing AppImage update information"; exit 1 ;;
          esac
          test -s "$APPIMAGE.zsync"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: network-monitor-${{ env.VERSION }}
          path: |
            build/network-monitor_*.deb
            build/network-monitor-*.rpm
            build/NetworkMonitor-*.AppImage
            build/NetworkMonitor-*.AppImage.zsync
            build/NetworkMonitor-*-linux-x86_64.tar.gz
            build/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Network Monitor ${{ env.VERSION }}
          tag_name: ${{ env.TAG_NAME }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: false
          files: |
            build/network-monitor_*.deb
            build/network-monitor-*.rpm
            build/NetworkMonitor-*.AppImage
            build/NetworkMonitor-*.AppImage.zsync
            build/NetworkMonitor-*-linux-x86_64.tar.gz
            build/SHA256SUMS
            build/SHA256SUMS.asc

      - name: Remove build tool from release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete-asset "${{ env.TAG_NAME }}" appimagetool-x86_64.AppImage -y || true

      # Repository signing is enabled by PUBLISH_SIGNED_REPOSITORY=true.
      # The live gh-pages repository is updated from the official release assets.
      - name: Check package repository signing key
        id: repo_key
        if: startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_SIGNED_REPOSITORY == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GPG_PRIVATE_KEY is not configured; skipping signed package repository publication."
          fi

      - name: Publish signed package repository
        if: steps.repo_key.outputs.enabled == 'true'
        env:
          PUBLISH: "1"
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_BASE_URL: https://asemshahen.github.io/NetworkMonitor
        run: ./packaging/publish-repo.sh
