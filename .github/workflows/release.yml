name: Release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (for example 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm desktop-file-utils file

      - name: Cache Python runtime
        uses: actions/cache@v4
        with:
          path: build/runtime
          key: runtime-${{ runner.os }}-${{ hashFiles('packaging/build-runtime.sh') }}

      - name: Build Python runtime
        run: ./packaging/build-runtime.sh

      - name: Build packages
        run: |
          ./packaging/build-deb.sh
          ./packaging/build-rpm.sh
          ./packaging/build-appimage.sh
          cd build
          sha256sum *.deb *.rpm *.AppImage > SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: network-monitor-${{ env.VERSION }}
          path: |
            build/*.deb
            build/*.rpm
            build/*.AppImage
            build/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Network Monitor ${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/*.deb
            build/*.rpm
            build/*.AppImage
            build/SHA256SUMS
