[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "network-monitor"
version = "1.0.9"
description = "Netlink-based per-application network monitor for Linux with monthly usage and cgroup v2 + nftables blocking"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "AL-Asem Software By Asem Shahen And DeepSeek V4.1 Flash Free", email = "asemshahen5@gmail.com"},
]
# Keep these bounds compatible with the versions shipped by Debian 13 and
# current Fedora branches so official distribution packages can use system
# libraries instead of the bundled runtime.
dependencies = ["PySide6>=6.8", "pyqtgraph>=0.13.7", "numpy>=1.24", "pyroute2>=0.7.7"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Monitoring",
]

[project.scripts]
network-monitor = "netmon.__main__:main"

[project.urls]
Homepage = "https://github.com/AsemShahen/NetworkMonitor"
Repository = "https://github.com/AsemShahen/NetworkMonitor"
Issues = "https://github.com/AsemShahen/NetworkMonitor/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"netmon.resources" = ["*.asc"]
"netmon.resources.icons" = ["*.png"]
