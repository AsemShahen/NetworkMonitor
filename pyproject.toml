[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "network-monitor"
version = "1.0.0"
description = "مراقب شبكة رسومي ل لينكس (Debian/Fedora)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8", "pyqtgraph>=0.14"]

[project.scripts]
network-monitor = "netmon.app:run"

[tool.setuptools.packages.find]
where = ["src"]
